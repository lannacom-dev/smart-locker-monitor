version: "3.8"

services:
  app:
    image: smart-locker-monitor-app:latest
    container_name: smart-locker-monitor-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Smart Locker Monitor"
      APP_ENV: production
      APP_KEY: "base64:tSu73fWkmbwt2inNrIwuIF6K88DBeAdr8LutJZapPvs="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smart_locker_monitor
      DB_USERNAME: smartlocker
      DB_PASSWORD: "SmartLocker@123"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartlocker

  reverb:
    image: smart-locker-monitor-app:latest
    container_name: smart-locker-monitor-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    ports:
      - "8080:8080"
    environment:
      APP_KEY: "base64:tSu73fWkmbwt2inNrIwuIF6K88DBeAdr8LutJZapPvs="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smart_locker_monitor
      DB_USERNAME: smartlocker
      DB_PASSWORD: "SmartLocker@123"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "smart-locker-monitor"
      REVERB_APP_KEY: "2asqu9ymmj6ndyhzoau4"
      REVERB_APP_SECRET: "tzg7sol90mdqv52xrsj0"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      QUEUE_CONNECTION: database
    depends_on:
      - app
    networks:
      - smartlocker

  mysql:
    image: mysql:8.4
    container_name: smart-locker-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_locker_monitor
      MYSQL_USER: smartlocker
      MYSQL_PASSWORD: "SmartLocker@123"
      MYSQL_ROOT_PASSWORD: "RootSmartLocker@123"
      TZ: Asia/Bangkok
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pRootSmartLocker@123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - smartlocker

volumes:
  mysql_data:
  app_storage:
  app_cache:

networks:
  smartlocker:
    driver: bridge