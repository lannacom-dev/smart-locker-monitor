services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smart-locker-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "SmartLocker@2026"
      MSSQL_COLLATION: "Thai_100_CI_AS"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - smartlocker
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SmartLocker@2026" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smart-locker-sql-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - echo "Creating database smart_locker_monitor with Thai collation if needed..." && /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "SmartLocker@2026" -C -Q "IF DB_ID(N'smart_locker_monitor') IS NULL CREATE DATABASE [smart_locker_monitor] COLLATE Thai_100_CI_AS; ALTER DATABASE [smart_locker_monitor] COLLATE Thai_100_CI_AS;" && echo "Database smart_locker_monitor is ready."
    networks:
      - smartlocker

  app:
    image: smart-locker-monitor-app:latest
    container_name: smart-locker-monitor-app
    restart: unless-stopped
    depends_on:
      sql-init:
        condition: service_completed_successfully
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Smart Locker Monitor"
      APP_ENV: production
      APP_KEY: "base64:tSu73fWkmbwt2inNrIwuIF6K88DBeAdr8LutJZapPvs="
      APP_DEBUG: "false"
      APP_TIMEZONE: "Asia/Bangkok"
      TZ: "Asia/Bangkok"
      APP_URL: "http://smart-locker.lanna.co.th:8000"
      ASSET_URL: "http://smart-locker.lanna.co.th:8000"
      SESSION_DOMAIN: "smart-locker.lanna.co.th"

      DB_CONNECTION: sqlsrv
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_DATABASE: "smart_locker_monitor"
      DB_USERNAME: sa
      DB_PASSWORD: "SmartLocker@2026"
      DB_ENCRYPT: "no"
      DB_TRUST_SERVER_CERTIFICATE: "true"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
      FORCE_SEED: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - smartlocker

  reverb:
    image: smart-locker-monitor-app:latest
    container_name: smart-locker-monitor-reverb
    restart: unless-stopped
    depends_on:
      sql-init:
        condition: service_completed_successfully
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    ports:
      - "8080:8080"
    environment:
      APP_KEY: "base64:tSu73fWkmbwt2inNrIwuIF6K88DBeAdr8LutJZapPvs="
      APP_TIMEZONE: "Asia/Bangkok"
      TZ: "Asia/Bangkok"
      APP_URL: "http://smart-locker.lanna.co.th:8000"
      ASSET_URL: "http://smart-locker.lanna.co.th:8000"
      SESSION_DOMAIN: "smart-locker.lanna.co.th"

      DB_CONNECTION: sqlsrv
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_DATABASE: "smart_locker_monitor"
      DB_USERNAME: sa
      DB_PASSWORD: "SmartLocker@2026"
      DB_ENCRYPT: "no"
      DB_TRUST_SERVER_CERTIFICATE: "true"

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "smart-locker-monitor"
      REVERB_APP_KEY: "2asqu9ymmj6ndyhzoau4"
      REVERB_APP_SECRET: "tzg7sol90mdqv52xrsj0"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      QUEUE_CONNECTION: database
    networks:
      - smartlocker

volumes:
  sqlserver_data:
  app_storage:
  app_cache:

networks:
  smartlocker:
    driver: bridge
